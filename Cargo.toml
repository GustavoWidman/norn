[package]
name = "norn"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "norn"
path = "src/bin/norn.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std", "clock"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.2"
zeroize = { version = "1.9.0", features = ["std"] }

